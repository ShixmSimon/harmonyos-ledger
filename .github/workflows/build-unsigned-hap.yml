name: Build unsigned HarmonyOS HAP

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unsigned-hap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out full Git history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Linux graphics library
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libgl1-mesa-dev

      - name: Install HarmonyOS 26 command line tools
        shell: bash
        run: |
          set -euo pipefail
          install_root="$RUNNER_TEMP/harmonyos-cli"
          mkdir -p "$install_root"
          cd "$install_root"
          df -h "$RUNNER_TEMP"

          curl --fail --location --retry 3 --retry-delay 2 \
            'https://github.com/ErBWs/ohos-sdk/releases/download/26.0.0.821/ohos-sdk-linux-amd64.tar.gz.aa' \
            --output commandline-tools.tar.gz.aa
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://github.com/ErBWs/ohos-sdk/releases/download/26.0.0.821/ohos-sdk-linux-amd64.tar.gz.ab' \
            --output commandline-tools.tar.gz.ab

          cat commandline-tools.tar.gz.aa commandline-tools.tar.gz.ab > commandline-tools.tar.gz
          echo '0cbdf7ac5c1be1e42694d448ffaee0c0be0ba9a948197e2bc5b61ca5bdc481f2  commandline-tools.tar.gz' | sha256sum --check --strict
          rm commandline-tools.tar.gz.aa commandline-tools.tar.gz.ab
          tar -xzf commandline-tools.tar.gz
          rm commandline-tools.tar.gz

          echo "$install_root/command-line-tools/tool/node/bin" >> "$GITHUB_PATH"
          echo "$install_root/command-line-tools/bin" >> "$GITHUB_PATH"
          echo "HOS_SDK_HOME=$install_root/command-line-tools/sdk" >> "$GITHUB_ENV"
          echo "OHOS_NDK_HOME=$install_root/command-line-tools/sdk/default/openharmony" >> "$GITHUB_ENV"
          df -h "$RUNNER_TEMP"

      - name: Verify HarmonyOS build tools
        run: |
          java --version
          node --version
          hvigorw -v

      - name: Build unsigned HAP
        id: build-hap
        shell: bash
        run: |
          set -o pipefail
          test ! -e signing.local.json
          hvigorw assembleHap --mode module -p product=default --no-daemon 2>&1 | tee "$RUNNER_TEMP/hvigor-build.log"

          shopt -s nullglob
          hap_files=(entry/build/default/outputs/default/*.hap)
          if [[ ${#hap_files[@]} -ne 1 ]]; then
            printf 'Expected one HAP file, found %s\n' "${#hap_files[@]}"
            printf '%s\n' "${hap_files[@]}"
            exit 1
          fi
          echo "hap_path=${hap_files[0]}" >> "$GITHUB_OUTPUT"
          echo "HAP output: ${hap_files[0]}"

      - name: Expose build diagnostics
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          log_path = Path(os.environ['RUNNER_TEMP']) / 'hvigor-build.log'
          if log_path.is_file():
              output = '\n'.join(log_path.read_text(errors='replace').splitlines()[-40:])[-6000:]
              if output:
                  output = output.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::notice title=Hvigor build diagnostics::{output}')
          PY

      - name: Upload HAP artifact
        uses: actions/upload-artifact@v7
        with:
          name: harmonyledger-unsigned-${{ github.run_number }}
          path: ${{ steps.build-hap.outputs.hap_path }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish HAP release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download unsigned HAP artifact
        uses: actions/download-artifact@v7
        with:
          name: harmonyledger-unsigned-${{ github.run_number }}
          path: release

      - name: Generate SHA-256 checksum
        shell: bash
        run: |
          set -euo pipefail
          hap_files=(release/*.hap)
          if [[ ${#hap_files[@]} -ne 1 ]]; then
            printf 'Expected one HAP file, found %s\n' "${#hap_files[@]}"
            printf '%s\n' "${hap_files[@]}"
            exit 1
          fi
          hap_name="${hap_files[0]##*/}"
          (cd release && sha256sum "$hap_name" > "$hap_name.sha256")

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*.hap
            release/*.hap.sha256
